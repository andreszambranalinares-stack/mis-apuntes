<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis Apuntes</title>
  <meta name="description" content="Apuntes visuales e interactivos para estudiar: mapas cerebrales, experimentos jugables, tarjetas y tests.">
  <meta name="theme-color" content="#F4EEE2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110D" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/blocks.css">
  <link rel="stylesheet" href="assets/css/viz.css">
  <link rel="stylesheet" href="assets/css/study.css">
  <script>
    try { const t = localStorage.getItem('ma:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    try { if (localStorage.getItem('ma:rail') === '1') document.documentElement.classList.add('rail'); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Temario">
      <div class="sb-head">
        <a href="#/" class="brand" aria-label="Mis Apuntes, inicio">
          <img src="favicon.svg" alt="" width="34" height="34">
          <span class="brand-name">Mis <em>Apuntes</em></span>
        </a>
        <button class="icon-btn sb-collapse" id="railToggle" aria-label="Plegar menú" title="Plegar menú (B)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button class="icon-btn sb-close" id="sbClose" aria-label="Cerrar menú">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <button class="search-trigger" data-open-search>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span>Buscar concepto…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <nav class="sb-nav" id="sbNav"></nav>
      <div class="sb-foot">
        <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema claro u oscuro">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
          <span>Tema</span>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="stage">
      <header class="topbar">
        <button class="icon-btn" id="sbOpen" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <div class="crumbs" id="crumbs"></div>
        <button class="icon-btn" data-open-search aria-label="Buscar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <div class="readbar" id="readbar" aria-hidden="true"><span></span></div>
      </header>

      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <nav class="tabbar" aria-label="Accesos rápidos">
    <a href="#/" data-tab="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/></svg><span>Inicio</span></a>
    <button data-tab="temario" id="tabTemario"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h10"/></svg><span>Temario</span></button>
    <a href="#/tarjetas" data-tab="tarjetas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="12" rx="1.5"/><path d="M7 4h12.5A1.5 1.5 0 0121 5.5V16"/></svg><span>Tarjetas</span></a>
    <a href="#/test" data-tab="test"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l2.5 2.5L16 9"/><rect x="4" y="4" width="16" height="16" rx="2"/></svg><span>Test</span></a>
    <a href="#/atlas" data-tab="atlas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5c-3 0-5 2.5-5 5.5S5 17 8 17c.5 2 2.2 3 4 3s3.5-1 4-3c3 0 5-2.5 5-6.5S19 5 16 5c-1-1.3-2.4-2-4-2S9 3.7 8 5z"/><path d="M12 3v17"/></svg><span>Atlas</span></a>
  </nav>

  <div class="search" id="search" hidden role="dialog" aria-modal="true" aria-label="Buscar en los apuntes">
    <div class="search-box">
      <div class="search-input">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="searchInput" type="search" placeholder="Busca: pulvinar, Stroop, qualia…" autocomplete="off" aria-label="Término de búsqueda">
        <button class="search-close" id="searchClose" aria-label="Cerrar búsqueda"><span class="lbl-desk"><kbd>Esc</kbd></span><span class="lbl-touch">Cerrar</span></button>
      </div>
      <ul class="search-results" id="searchResults" role="listbox"></ul>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
